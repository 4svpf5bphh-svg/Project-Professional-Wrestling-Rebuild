name: Verify individual Genesis photos (unreleased)
on:
  push:
    branches:
      - feature/genesis-portrait-completion-20261023
    paths:
      - scripts/resolve-individual-genesis.ts
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/genesis-portrait-completion-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Review all single-subject Commons matches and reject misleading identities
        run: npx tsx scripts/resolve-individual-genesis.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: individual-portrait-decisions
          path: data/genesis-individual-review.json
          retention-days: 90
          if-no-files-found: warn
      - name: Complete TS, unit and build checks
        run: |
          npm run typecheck
          npm test
          npm run web:build
      - name: Confirm every source still exists and permits reuse
        run: npx tsx scripts/audit-portraits.ts
      - name: Commit verified source additions without touching live main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/genesis-portrait-worklist.json data/portrait-assessment.json data/portrait-discovery-checkpoint.json data/genesis-individual-review.json src/ui/wrestler-portrait.ts apps/web/public/portrait-credits.html
          if ! git diff --cached --quiet; then
            git commit -m "feat(portraits): verify genuine individual Commons subjects in Genesis"
            git push origin HEAD:feature/genesis-portrait-completion-20261023
          fi
