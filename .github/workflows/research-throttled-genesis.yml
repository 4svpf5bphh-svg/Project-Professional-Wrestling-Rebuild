name: Recover throttled Genesis Commons searches (unreleased)
on:
  push:
    branches:
      - feature/genesis-portrait-completion-20261023
    paths:
      - scripts/research-throttled-genesis.ts
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assess:
    if: github.ref == 'refs/heads/feature/genesis-portrait-completion-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Search all remaining rate-limited names in groups of six
        run: npx tsx scripts/research-throttled-genesis.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-genesis-commons-findings
          path: data/genesis-bulk-candidates.json
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve resumable offline source review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/genesis-bulk-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "research(portraits): assess throttled Genesis names through grouped Commons queries"
            git push origin HEAD:feature/genesis-portrait-completion-20261023
          fi
