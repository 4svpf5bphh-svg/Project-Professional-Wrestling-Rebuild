name: Verify rebuild
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppw_test
          POSTGRES_PASSWORD: ppw_test
          POSTGRES_DB: ppw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppw_test -d ppw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Apply foundation schema to disposable PostgreSQL
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
      - name: Apply contract availability indexes
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0002_contract_availability.sql
      - name: Apply show resolution uniqueness migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0003_show_resolution_receipts.sql
      - name: Apply submitted show binding migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0004_submitted_show_binding.sql
      - name: Apply single World deadline migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0005_single_world_deadline.sql
      - name: Apply weekly completion certification migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0006_week_completion_seals.sql
      - name: Apply show day and venue columns
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0007_show_day_venue.sql
      - name: Apply World resource registry and service capacity
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0008_weekly_resources.sql
      - name: Apply pre-resolution resource clearance migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0009_week_resource_clearances.sql
      - name: Apply durable provisional arbitration migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0010_week_arbitration_proposals.sql
      - name: Apply explicit AI management authority migration
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0011_ai_remediation_authority.sql
      - name: Verify real concurrent claims and transaction rollback
        env:
          PPW_NEON_TEST_URL: postgres://ppw_test:ppw_test@localhost:5432/ppw_test
        run: npm run test:postgres
