name: Verify rebuild
on:
  push:
  pull_request:
# A branch's CI can be expensive; obsolete 100+ browser and database suites
# must not pile up while newer, integrated commits are ready to verify.
concurrency:
  group: rebuild-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppw_test
          POSTGRES_PASSWORD: ppw_test
          POSTGRES_DB: ppw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppw_test -d ppw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Build iPhone-first PWA without publishing it
        run: npm run web:build
      - name: Install Chromium for iPhone host testing
        run: npx playwright install --with-deps chromium
      - name: Run authenticated browser host smoke tests
        run: npm run test:browser
      - name: Save mobile presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppw-presentation-screenshots
          path: test-results
          retention-days: 7
      - run: npm test
      - name: Apply foundation schema to disposable PostgreSQL
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
      - name: Apply contract availability indexes
        env:
          PGPASSWORD: ppw_test
        run: psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f db/migrations/0002_contract_availability.sql
      - name: Apply show resolution uniqueness migration
