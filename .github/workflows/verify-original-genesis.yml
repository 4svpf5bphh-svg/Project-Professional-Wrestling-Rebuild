name: Verify authentic original-main Genesis
on:
  push:
    paths:
      - ".github/workflows/verify-original-genesis.yml"
      - "scripts/playtest-export-original.ts"
      - "src/domain/original-main-fresh-export.ts"
      - "src/domain/original-genesis-projection.ts"
      - "src/db/import-original-genesis.ts"
      - "db/migrations/0080_original_roster_affiliations.sql"
      - "src/db/generate-staff-fallback-cards.ts"
      - "src/db/week-conflicts.ts"
      - "src/db/appearance-consumption.ts"
      - "src/db/show-card-editor.ts"
      - "src/db/player-world-overview.ts"
      - "src/ui/show-planner.ts"
      - "src/web/card-browser.ts"
      - "apps/web/src/main.ts"
      - "tests/browser/playtest-shell-journey.spec.ts"
      - "src/db/wrestler-directory.ts"
      - "tests/original-main-fresh-export.test.ts"
      - "tests/original-genesis-postgres.test.ts"
      - "scripts/playtest-genesis.ts"
      - "tests/real-genesis-two-player-smoke.test.ts"
      - "scripts/playtest-resolve-original-ci.ts"
      - "src/db/playtest-preview-readiness.ts"
      - "src/db/reconcile-original-main-genesis.ts"
      - "scripts/playtest-reconcile-main.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-world-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppw_test
          POSTGRES_PASSWORD: ppw_test
          POSTGRES_DB: ppw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppw_test -d ppw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout rebuilt PPW main
        uses: actions/checkout@v4
        with:
          path: rebuild
          persist-credentials: false
      - name: Checkout original PPW main (NEVER alpha-1a)
        uses: actions/checkout@v4
        with:
          repository: 4svpf5bphh-svg/Project-Professional-Wrestling
          ref: main
          path: original
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install original's published dependencies, no build or database
        working-directory: original
        run: npm install --no-audit --no-fund
      - name: Install rebuild's TypeScript runner
        working-directory: rebuild
        run: npm install --no-audit --no-fund
      - name: Execute genuine original-main 643-person factory and validate export
        working-directory: rebuild
        run: |
          npm run playtest:export-original -- \
            --original-root "$GITHUB_WORKSPACE/original" \
            --seed 20261019 \
            --out "$RUNNER_TEMP/fresh-original-main-genesis.json"
      - name: Certify offline original main identity, contracts, titles and takeovers
        env:
          FRESH_SOURCE: ${{ runner.temp }}/fresh-original-main-genesis.json
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const source=JSON.parse(readFileSync(process.env.FRESH_SOURCE,"utf8"));
          assert.equal(source.world.currentDate.week,1);
          assert.equal(source.people.length,643);
          assert.equal(source.personas.length,643);
          assert.ok(source.personas.every(x=>x.persona.finishingMoves.length>=1 &&
           x.persona.signatureMoves.length>=2));
          assert.equal(source.promotions.length,13);
          assert.ok(source.contracts.length>=200);
          assert.ok(source.teams.length>=10);
          assert.ok(source.teamMemberships.length>=20);
          assert.ok(source.people.filter(p=>p.bookingDivision==="WOMEN").length>=150);
          const names=new Set(source.people.map(p=>p.name));
          assert.ok(names.has("Cody Rhodes")&&names.has("Rhea Ripley"));
          assert.ok(source.people.every(p=>typeof p.portableGimmickId==="string"));
          const protectedReal=source.promotions.filter(p=>
           p.identity?.origin==="REAL_WORLD"&&p.playerTakeoverEligibility==="LOCKED");
          const eligible=source.promotions.filter(p=>
           p.playerTakeoverEligibility==="STANDARD");
          assert.equal(protectedReal.length,8);
          assert.equal(eligible.length,5);
          for(const name of ["WWE","AEW","NJPW","NXT","TNA Wrestling","ROH","CMLL","STARDOM"])
           assert.ok(protectedReal.some(p=>p.name===name));
          console.log(JSON.stringify({
           status:"AUTHENTIC_MAIN_GENESIS_VERIFIED",
           wrestlers:source.people.length,
           women:source.people.filter(p=>p.bookingDivision==="WOMEN").length,
           promotions:source.promotions.length,realProtected:protectedReal.length,
           claimable:eligible.length,teams:source.teams.length,
           contracts:source.contracts.length
          }));
          NODE
      - name: Apply all rebuild migrations to disposable CI PostgreSQL
        working-directory: rebuild
        env:
          PGPASSWORD: ppw_test
        run: |
          for migration in db/migrations/*.sql; do
            psql -h localhost -U ppw_test -d ppw_test \
              -v ON_ERROR_STOP=1 -f "$migration" > /dev/null
          done
      - name: Import authentic source into disposable World and certify playtest population
        working-directory: rebuild
        env:
          PPW_PLAYTEST_DB_URL: postgresql://ppw_test:ppw_test@localhost:5432/ppw_test
          PPW_GENESIS_IMPORT_AUTHORIZED: "YES"
          SOURCE_FILE: ${{ runner.temp }}/fresh-original-main-genesis.json
        run: |
          WORLD="$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            console.log(JSON.parse(readFileSync(process.env.SOURCE_FILE,"utf8")).world.id);
          ')"
          PPW_PLAYTEST_WORLD_ID="$WORLD" npm run playtest:genesis -- \
            --world "$WORLD" --source "$SOURCE_FILE" \
            --confirm-world "$WORLD" --confirm-host localhost
          npm run playtest:preflight -- --world "$WORLD"
      - name: Validate in-place original-main identity recovery in disposable CI
        working-directory: rebuild
        env:
          PPW_PLAYTEST_DB_URL: postgresql://ppw_test:ppw_test@localhost:5432/ppw_test
          SOURCE_FILE: ${{ runner.temp }}/fresh-original-main-genesis.json
          PGPASSWORD: ppw_test
        run: |
          WORLD="$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            console.log(JSON.parse(readFileSync(process.env.SOURCE_FILE,"utf8")).world.id);
          ')"
          # Deliberately simulate a pre-reconciliation imported World ONLY in
          # disposable CI PostgreSQL. Never issue these DELETEs to Neon main.
          psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 \
            -v world_id="$WORLD" <<'SQL'
          BEGIN;
          DELETE FROM ppw_wrestler_promotion_affiliations WHERE world_id=:'world_id';
          DELETE FROM ppw_tag_team_members WHERE world_id=:'world_id';
          DELETE FROM ppw_tag_teams WHERE world_id=:'world_id';
          DELETE FROM ppw_portable_personas WHERE world_id=:'world_id';
          DELETE FROM ppw_promotion_standings WHERE world_id=:'world_id';
          UPDATE ppw_promotions SET parent_promotion_id=NULL WHERE world_id=:'world_id';
          UPDATE ppw_people SET portable_gimmick_id=NULL WHERE world_id=:'world_id';
          COMMIT;
          SQL
          PPW_PLAYTEST_WORLD_ID="$WORLD" PPW_GENESIS_RECONCILE_AUTHORIZED=YES \
          npm run playtest:reconcile-main -- \
            --world "$WORLD" --source "$SOURCE_FILE" \
            --confirm-world "$WORLD" --confirm-host localhost
          npm run playtest:preflight -- --world "$WORLD"
      - name: Log in two independent bookers and open authentic private workspaces
        working-directory: rebuild
        env:
          CI: "true"
          PPW_REAL_WORLD_SMOKE_AUTHORIZED: "YES"
          PPW_PLAYTEST_DB_URL: postgresql://ppw_test:ppw_test@localhost:5432/ppw_test
          SOURCE_FILE: ${{ runner.temp }}/fresh-original-main-genesis.json
        run: npx tsx --test tests/real-genesis-two-player-smoke.test.ts
      - name: Publish exactly one genuine original World week in disposable CI
        working-directory: rebuild
        env:
          CI: "true"
          PPW_REAL_WORLD_RESOLUTION_SMOKE: "YES"
          PPW_PLAYTEST_DB_URL: postgresql://ppw_test:ppw_test@localhost:5432/ppw_test
          SOURCE_FILE: ${{ runner.temp }}/fresh-original-main-genesis.json
        run: npx tsx scripts/playtest-resolve-original-ci.ts
