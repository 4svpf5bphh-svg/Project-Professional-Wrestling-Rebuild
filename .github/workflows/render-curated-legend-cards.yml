name: Render real-photo Legends card drafts (development only)
on:
  push:
    branches: [feature/phase8-world-ux]
    paths:
      - "scripts/build_curated_legend_cards.py"
      - "scripts/check_legend_card_layout.py"
      - "data/legend-approved-photo-sources.json"
      - ".github/workflows/render-curated-legend-cards.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: legend-draft-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cards:
    if: github.ref == 'refs/heads/feature/phase8-world-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible local renderer
        run: pip install "pillow==11.3.0"
      - name: Check photo-safe card layout (offline)
        run: python scripts/check_legend_card_layout.py
      - name: Render manually curated photo drafts and audit metadata
        id: render
        continue-on-error: true
        env:
          PPW_LEGEND_BATCH: ${{ matrix.batch }}
        run: python scripts/build_curated_legend_cards.py
      - name: Retain the contact sheet for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-photo-legends-batch-${{ matrix.batch }}-review
          path: |
            data/legend-card-contact-sheet-batch-${{ matrix.batch }}.webp
            data/legend-render-audit-batch-${{ matrix.batch }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stage source-backed card draft assets only on development branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/assets/legends data/legend-render-audit-batch-${{ matrix.batch }}.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(legends): render actual wrestler-photo card drafts for review"
            git pull --rebase origin feature/phase8-world-ux
            git push origin HEAD:feature/phase8-world-ux
      - name: Surface partial artwork until Wikimedia source access succeeds
        if: steps.render.outcome == 'failure'
        run: |
          echo "Partial real-photo drafts were saved; some Commons images were inaccessible. No collectible flags have been enabled."
          exit 1
