name: Verify Staff Office
on:
  push:
    branches: ['feature/staff-office-world-20261023']
  workflow_dispatch:
concurrency:
  group: staff-office-${{ github.ref }}
  cancel-in-progress: true
jobs:
  staff-office:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppw_test
          POSTGRES_PASSWORD: ppw_test
          POSTGRES_DB: ppw_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ppw_test -d ppw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and production bundle
        run: npm run typecheck && npm run web:build
      - name: Run unit tests
        run: npm test
      - name: Apply migrations against disposable PostgreSQL
        env:
          PGPASSWORD: ppw_test
        run: |
          set -euo pipefail
          for script in db/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "Applying $script"
            psql -h localhost -U ppw_test -d ppw_test -v ON_ERROR_STOP=1 -f "$script" >/dev/null
          done
      - name: Staff and existing economy integration tests
        env:
          PPW_NEON_TEST_URL: postgres://ppw_test:ppw_test@localhost:5432/ppw_test
        run: |
          npx tsx --test tests/staff-office-postgres.test.ts tests/staff-workspace-postgres.test.ts tests/staff-auto-renewal-postgres.test.ts tests/business-workspace-postgres.test.ts tests/weekly-finance-budget-postgres.test.ts tests/show-economics-postgres.test.ts tests/world-resolution-journey-postgres.test.ts
      - name: Install Chromium browser only
        run: npx playwright install chromium
      - name: iPhone Staff Office employment journey
        run: npx playwright test tests/browser/staff-office.spec.ts --config playwright.config.ts
